name = "html-preview-admin"
main = "src/admin/index.ts"
compatibility_date = "2026-08-21"

[assets]
directory = "./src/admin/assets"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "html-preview"
database_id = "D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "html-preview-files"

[vars]
PREVIEW_BASE_URL = "PREVIEW_WORKER_URL"
