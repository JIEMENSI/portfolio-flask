{% extends "base.html" %}
{% block title %}登录 - 个人作品集{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
    <h1 class="text-xl font-bold text-gray-900 text-center mb-2">登录</h1>
    <p class="text-center text-sm text-gray-500 mb-6">管理员账号可上传作品，游客仅可浏览</p>
    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">账号</label>
        <input type="text" id="username" name="username" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="请输入账号">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" id="password" name="password" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
               placeholder="请输入密码">
      </div>
      <button type="submit"
              class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
        管理员登录
      </button>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
      <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-gray-400">或者</span></div>
    </div>

    <a href="{{ url_for('guest_login') }}"
       class="block w-full py-2.5 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors text-center">
      游客登录
    </a>
    <p class="mt-4 text-center text-xs text-gray-400">游客可浏览所有作品，但不能上传</p>
  </div>
</div>
{% endblock %}
