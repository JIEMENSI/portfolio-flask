{% extends "base.html" %}
{% block title %}上传作品 - 个人作品集{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">
  <div class="mb-6">
    <a href="{{ url_for('admin') }}" class="text-sm text-blue-600 hover:underline">← 返回管理后台</a>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 p-6 sm:p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-6">上传 HTML 作品</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
          作品名称 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="title" name="title" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="请输入作品名称">
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">作品简介（可选）</label>
        <textarea id="description" name="description" rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="简单介绍这个作品"></textarea>
      </div>

      <div>
        <label for="remark" class="block text-sm font-medium text-gray-700 mb-1">备注（可选）</label>
        <input type="text" id="remark" name="remark"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="例如：客户、来源、版本等">
      </div>

      <div>
        <label for="html_file" class="block text-sm font-medium text-gray-700 mb-1">
          选择 HTML 文件 <span class="text-red-500">*</span>
        </label>
        <input type="file" id="html_file" name="html_file" accept=".html,.htm" required
               class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <p class="mt-1 text-xs text-gray-400">仅支持 .html 或 .htm 文件，最大 16MB</p>
      </div>

      <div>
        <label for="cover_file" class="block text-sm font-medium text-gray-700 mb-1">
          作品封面图（可选）
        </label>
        <input type="file" id="cover_file" name="cover_file" accept=".png,.jpg,.jpeg,.gif,.webp"
               class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-gray-50 file:text-gray-700 hover:file:bg-gray-100">
        <p class="mt-1 text-xs text-gray-400">支持 png / jpg / jpeg / gif / webp，建议正方形图片</p>
      </div>

      <button type="submit"
              class="w-full py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
        上传作品
      </button>
    </form>
  </div>
</div>
{% endblock %}
