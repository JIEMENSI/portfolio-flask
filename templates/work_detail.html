{% extends "base.html" %}
{% block title %}{{ work.title }} - 个人作品集{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-6">
    <a href="{{ url_for('works_list') }}" class="text-sm text-blue-600 hover:underline">← 返回作品列表</a>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
    <h1 class="text-2xl font-bold text-gray-900">{{ work.title }}</h1>
    {% if work.description %}
    <p class="mt-2 text-gray-600">{{ work.description }}</p>
    {% endif %}
    <p class="mt-3 text-sm text-gray-400">上传时间：{{ work.created_at }}</p>
    <div class="mt-4 flex gap-3">
      <a href="{{ url_for('preview', work_id=work.id) }}" target="_blank"
         class="inline-flex items-center px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">
        新窗口打开完整作品
      </a>
    </div>
  </div>

  <!-- 作品预览（iframe） -->
  <div class="bg-white rounded-xl border border-gray-200 p-2">
    <p class="text-xs text-gray-400 px-2 py-1">作品预览（下方为嵌入的 HTML 内容）</p>
    <div class="iframe-container">
      <iframe src="{{ url_for('preview', work_id=work.id) }}" sandbox="allow-scripts allow-same-origin allow-forms" title="{{ work.title }}"></iframe>
    </div>
  </div>
</div>
{% endblock %}
